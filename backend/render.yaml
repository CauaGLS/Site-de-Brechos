# Render Blueprint for the Django (django-ninja) backend.
#
# This file lives in backend/ because the repo is a monorepo (frontend/ +
# backend/). When creating the Blueprint in the Render dashboard
# ("New +" -> "Blueprint"), point it at this file's path
# (Settings -> "Blueprint file path" -> backend/render.yaml) or move it to
# the repo root — either way `rootDir: backend` below makes every command
# run from the backend/ directory.
#
# Free tier notes:
#   - `plan: free` web services spin down after periods of inactivity and
#     spin back up (with a cold-start delay) on the next request.
#   - The free Postgres database is deleted automatically after 90 days
#     unless upgraded; back up data or upgrade before that.

databases:
  - name: brechos-db
    databaseName: brechos
    user: brechos
    plan: free
    region: oregon

services:
  - type: web
    name: brechos-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Render's automatic external hostname (<service>.onrender.com) is
      # appended to ALLOWED_HOSTS by settings.py automatically; add your own
      # custom domain(s) here too, comma-separated, if you set one up.
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      # Comma-separated list, e.g. https://your-frontend.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Comma-separated list, e.g. https://your-frontend.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: brechos-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "True"
      - key: TIME_ZONE
        value: "America/Sao_Paulo"
